<header class="pera-topbar">
  <div class="pera-topbar__inner">
    <span class="pera-brand"><span><strong class="pera-brand__name">PERA</strong><span class="pera-brand__subtitle">Tutorías y refuerzo académico</span></span></span>
  @if (router.url !== '/login' && router.url !== '/') {
    <button type="button" class="pera-topbar__link pera-topbar__actions" (click)="salir()">Cerrar sesión</button>
  }
  </div>
</header>
<main class="pera-container pera-page">
  @if (error() && router.url !== '/login') { <p class="pera-alert pera-alert--danger" role="alert">{{ error() }}</p> }
  <router-outlet />
</main>
