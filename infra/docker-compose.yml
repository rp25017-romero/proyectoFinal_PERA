services:
  postgres:
    image: postgres:17
    container_name: pera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pera_db
      POSTGRES_USER: pera_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pera_data:/var/lib/postgresql/data
      - ../database:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pera_user -d pera_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ../pera-backend
    volumes:
      - ../database:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: pera_db
      PGUSER: pera_user
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pera_data:
